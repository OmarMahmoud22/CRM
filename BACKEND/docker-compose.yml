services:
    # Backend service
  backend:
    # build image dockerfile
    build: .
    # Name of the backend container
    container_name: crm-backend
    env_file:
      - .env
    ports:
      - "4000:4000"
    # add my app in listener mood (Bind Mount)
    volumes:
      - .:/app
      - /crm/node_modules
    depends_on:
      - mongodb  
  mongodb:
    # from dockerHup
    image: mongo:latest
    # Name of the mongo container
    container_name: crm-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db  

volumes:
  mongo_data:      
      
